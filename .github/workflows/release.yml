name: Release

# Publishing is driven by GitHub Releases: cut a release tagged `v0.2.0` (or `0.2.0`) and this
# packs every Fila package at that version and pushes it to nuget.org. Azure Pipelines still
# owns PR validation — this workflow duplicates its build and test steps only so a release is
# never cut from a revision that does not compile or pass.
#
# Authentication is nuget.org trusted publishing (OIDC), not a stored API key: the job mints a
# short-lived key at push time from this run's own GitHub identity. Two things have to line up
# outside this file for that to work —
#   * the trusted publishing policy on nuget.org, which nuget.org matches this run against, and
#   * the NUGET_USER repository variable, holding the nuget.org username that created it.
# Neither the release nor the workflow_dispatch trigger can run from a fork, so a fork never
# reaches the OIDC token in the first place.
on:
  release:
    types: [published]

  # A hand-run escape hatch: re-publishing after a push half-failed, or a pack-only dry run
  # that produces the .nupkg files as a workflow artifact without touching nuget.org.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack, without a leading v (e.g. 0.2.0 or 0.2.0-beta.1).'
        required: true
        type: string
      publish:
        description: 'Push to nuget.org. Leave unchecked for a pack-only dry run.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One release at a time: two overlapping runs would race to push the same version, and the
# loser's packages would fail or be silently skipped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # id-token: write is what lets the runner mint the GitHub OIDC token NuGet/login trades for
    # a publishing key — without it the action fails outright rather than falling back to
    # anything. Declared per-job rather than at the workflow level so a future job in this file
    # doesn't silently inherit the ability to assume this repository's publishing identity.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the package version
        # Read through the environment rather than interpolating directly into the script: a tag
        # name is attacker-influenced text, and `${{ }}` inside a run block is textual
        # substitution.
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::'$RAW_VERSION' is not a version this workflow can publish. Tag releases as 0.2.0 or v0.2.0, optionally with a prerelease suffix (0.2.0-beta.1)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Packing Fila $version"

      - name: Create the local package source
        run: mkdir -p artifacts/nuget-local
        # nuget.config lists artifacts/nuget-local (gitignored) as a package source. NuGet fails
        # every restore with NU1301 if a configured source does not exist at all — even for
        # projects that never pull a package from it — which a fresh checkout hits. Nothing in
        # this workflow reads from it; it just has to be there.

      - name: Restore
        run: dotnet restore Fila.slnx

      - name: Build
        run: >-
          dotnet build Fila.slnx --configuration Release --no-restore
          -p:Version=${{ env.VERSION }} -p:ContinuousIntegrationBuild=true
        # Version has to be a command-line property: Directory.Build.props assigns it, and a
        # project-level assignment beats an environment variable. The same two properties are
        # repeated below so --no-build sees an identical global-property set and reuses this
        # build instead of quietly redoing it at the default version in Directory.Build.props.

      - name: Test
        run: >-
          dotnet test tests/Fila.Tests/Fila.Tests.csproj --configuration Release --no-build --logger trx
          -p:Version=${{ env.VERSION }} -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >-
          dotnet pack Fila.slnx --configuration Release --no-build --output artifacts/packages
          -p:Version=${{ env.VERSION }} -p:ContinuousIntegrationBuild=true
        # Packs whatever opted in with <IsPackable>true</IsPackable> — the src/ projects. Tests
        # and samples inherit the repo-wide false in Directory.Build.props and are skipped.

      - name: Smoke the packed fila tool
        run: |
          set -euo pipefail
          dotnet tool install Fila.Tools --version "$VERSION" \
            --add-source artifacts/packages --tool-path artifacts/tool-smoke
          artifacts/tool-smoke/fila --version
          artifacts/tool-smoke/fila --help
        # Installs the real .nupkg the way a user would, before it is published rather than
        # after. --tool-path instead of samples/Demo's tool manifest, which pins an exact
        # version and would have to be edited for every release just to run this check.
        # --version and --help are answered by the dispatcher itself, so this stays seconds.

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ env.VERSION }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      # Everything from here down only runs for an actual publish, so a pack-only dry run never
      # mints a key it isn't going to spend.
      - name: Check the publishing identity is configured
        if: ${{ github.event_name == 'release' || inputs.publish }}
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::The NUGET_USER repository variable is not set. Set it under Settings > Secrets and variables > Actions > Variables to the nuget.org username that *created* the trusted publishing policy (for an organization-owned package that is still the individual's username, not the organization's)."
            exit 1
          fi
          echo "Publishing to nuget.org as $NUGET_USER via trusted publishing."
        # A missing input would otherwise surface as NuGet/login's generic "Input required and
        # not supplied: user" in the middle of a release — this says which setting to add and
        # which of the two plausible usernames it wants.

      - name: Exchange the GitHub OIDC token for a publishing key
        id: nuget-login
        if: ${{ github.event_name == 'release' || inputs.publish }}
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
        # Trusted publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing):
        # the action posts this run's OIDC token to nuget.org's token endpoint and gets back a
        # short-lived API key, so no long-lived secret has to live in the repository at all.
        # nuget.org decides whether to issue one by matching the token's claims against the
        # policy configured there. Deliberately placed *after* the build/test/pack steps rather
        # than at the top of the job: the key is short-lived, and there is no reason to start
        # its clock before there is something to push. The action masks the key it returns
        # (core.setSecret), so it stays redacted in the log.

      - name: Push to nuget.org
        if: ${{ github.event_name == 'release' || inputs.publish }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
        # push picks up each .snupkg sitting next to its .nupkg on its own, so symbols go up in
        # the same call. --skip-duplicate makes a re-run after a partial failure resume rather
        # than abort on the packages that already landed. The key arrives through the
        # environment rather than an inline ${{ }} so it is never substituted into the script
        # text the runner logs.
