<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fila">
  <title>Fila</title>
  <defs>
    <linearGradient id="fila-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Indigo, because #4f46e5 is the accent a Fila panel renders with before anyone calls
       .PrimaryColor(...) — the mark is the framework's own default, and stays clear of
       upstream Filament's amber. -->
  <rect width="64" height="64" rx="14" fill="url(#fila-tile)"/>

  <!-- An "F" whose arms are table rows: a left rail with rows running off it, which is both
       the initial and what "fila" means. The third row is detached and half-strength so the
       letter reads as an F rather than an E. -->
  <g fill="#fff">
    <rect x="18" y="16" width="6" height="32" rx="3"/>
    <rect x="18" y="16" width="28" height="6" rx="3"/>
    <rect x="18" y="29" width="20" height="6" rx="3"/>
    <rect x="27" y="42" width="17" height="6" rx="3" opacity=".55"/>
  </g>
</svg>
